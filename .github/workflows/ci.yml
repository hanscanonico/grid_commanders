name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # Pinned so a new ruff release cannot change the verdict; settings are
      # pinned separately in ruff.toml.
      - run: pip install ruff==0.16.2
      - run: ruff check .
      - run: ruff format --check .

  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt

      - name: Run the generator contract tests
        run: python -m unittest discover tests

      - name: Generate twice, assert byte determinism
        run: |
          python sprite_generator.py -o /tmp/gen_a
          python sprite_generator.py -o /tmp/gen_b
          diff -r /tmp/gen_a /tmp/gen_b

      - name: Assert committed .lavish/assets snapshots match generator output
        # The pair list is derived from the generation, both directions, so a
        # new output cannot land compared against nothing. See the module
        # docstring for what it checks and why it is a pixel comparison.
        run: python tests/check_snapshots.py /tmp/gen_a .lavish/assets


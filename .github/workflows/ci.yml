name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # Pinned so a new ruff release cannot change the verdict; settings are
      # pinned separately in ruff.toml.
      - run: pip install ruff==0.16.2
      - run: ruff check .
      - run: ruff format --check .

  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt

      - name: Run the generator contract tests
        run: python -m unittest discover tests

      - name: Generate twice, assert byte determinism
        run: |
          python audio_generator.py -o /tmp/gen_a --game .
          python audio_generator.py -o /tmp/gen_b --game .
          diff -r /tmp/gen_a/sfx /tmp/gen_b/sfx
          diff -r /tmp/gen_a/music /tmp/gen_b/music

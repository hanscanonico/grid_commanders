# Pins ruff so `ruff check .` and `ruff format --check .` give the same answer
# on every machine and every ruff release. The collector targets the Python in
# its own image, 3.12.
target-version = "py312"
line-length = 88

# .venv/ is gitignored (ruff skips it by default); repeated here so the checks
# still behave with --no-respect-gitignore.
extend-exclude = [".venv"]

[lint]
# ruff's default rule set, written out so a future default change cannot
# silently add or drop rules: pycodestyle errors + Pyflakes.
select = ["E4", "E7", "E9", "F"]

[format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"
skip-magic-trailing-comma = false

services:
  web:
    # Named rather than left to compose's project-derived default, so
    # deploy/web/deploy can tag the running build :previous and roll back to it.
    image: grid-commanders-web:latest
    build:
      context: ../..
      dockerfile: deploy/web/Dockerfile
    restart: unless-stopped
    ports:
      # Host-local only, for curl checks and LAN debugging via SSH tunnel.
      - "127.0.0.1:8090:80"
    healthcheck:
      # 127.0.0.1, not localhost: the alpine image resolves localhost to ::1
      # first, and nginx listens on IPv4 only.
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/healthz >/dev/null"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

  # The site monitor behind /admin. `web` deliberately does not depend on it:
  # nginx resolves its address per request, so the site serves whether this is
  # up, down or absent.
  admin:
    image: grid-commanders-admin:latest
    build:
      context: admin
    restart: unless-stopped
    environment:
      # `:-` for the same reason the tunnel token uses it: compose interpolates
      # the whole file, and a required key would refuse `up -d web` too. With
      # the Access pair unset the collector answers every /admin request 403.
      ADMIN_ACCESS_TEAM: ${ADMIN_ACCESS_TEAM:-}
      ADMIN_ACCESS_AUD: ${ADMIN_ACCESS_AUD:-}
      ADMIN_HASH_SECRET: ${ADMIN_HASH_SECRET:-}
    volumes:
      - admin-data:/data
    # No published port: the only way in is nginx, and the only way to nginx is
    # the tunnel.
    healthcheck:
      test:
        - CMD-SHELL
        - "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=3)\""
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

  cloudflared:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    # `:-` rather than `:?`: compose interpolates the whole file, so a required
    # token would refuse `up -d web` too. A missing one fails here, visibly.
    command: tunnel --no-autoupdate run --token ${CLOUDFLARE_TUNNEL_TOKEN:-}
    depends_on:
      web:
        condition: service_healthy

volumes:
  # The aggregates are kept forever, so they outlive every image rebuild.
  admin-data:

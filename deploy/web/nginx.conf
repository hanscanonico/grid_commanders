# The static server for the web build. No COOP/COEP headers: the preset exports
# without threads, which is what lets any host serve the page.
#
# Nothing here is immutable. The export does not hash filenames, so a browser
# that trusted a long max-age on index.wasm would run the old engine against the
# new index.pck after a redeploy. Every asset revalidates instead; ETag and
# Last-Modified stay on, so an unchanged file is a 304 rather than a re-download.
# The visitor's own address, as Cloudflare forwards it. Behind the tunnel every
# request carries the same remote address, so a limit keyed on that would be a
# limit on the whole site rather than on one visitor.
map $http_cf_connecting_ip $beat_client {
	""      $binary_remote_addr;
	default $http_cf_connecting_ip;
}

# /beat is the only route a stranger may write to. One a second per visitor is
# thirty times the heartbeat and nowhere near enough to fill a disk — which the
# grind box already did once, for want of exactly this.
limit_req_zone $beat_client zone=beat:1m rate=1r/s;

server {
	listen 80;
	server_name _;
	root /usr/share/nginx/html;
	index index.html;

	# Docker's embedded DNS, re-read often, so a restarted admin container is
	# found again without reloading nginx. ipv6=off: compose gives the service
	# an A record only, and asking for AAAA logs a failure every time.
	resolver 127.0.0.11 valid=10s ipv6=off;
	set $admin http://admin:8000;

	# The image's mime.types already names application/wasm, but a page that
	# silently loses streaming compilation is not a fault to leave to a base image.
	types {
		text/html html;
		text/plain txt;
		application/xml xml;
		application/javascript js;
		application/wasm wasm;
		application/octet-stream pck;
		application/json json;
		image/png png;
		image/svg+xml svg;
		image/x-icon ico;
	}

	gzip on;
	gzip_vary on;
	gzip_min_length 1024;
	gzip_types text/html text/plain application/xml application/javascript application/wasm application/octet-stream application/json;

	location = /healthz {
		access_log off;
		default_type text/plain;
		return 200 "ok\n";
	}

	# The entry points, which must never be stale: the landing page, the game
	# page under /play/, and the manifest and service worker a PWA export would
	# add (off today; see the preset). Naming them costs nothing while they are
	# absent. The landing page's own files join them — a sharing card, a sitemap
	# and a robots file are read by machines that come back, and none of them is
	# big enough for a revalidation to cost anything.
	location ~* (/index\.html|/manifest\.json|\.service\.worker\.js|^/sitemap\.xml|^/robots\.txt|^/og-battle\.png|^/favicon\.png)$ {
		add_header Cache-Control "no-cache";
	}

	location ~* \.(wasm|pck|js)$ {
		add_header Cache-Control "public, max-age=0, must-revalidate";
	}

	location / {
		try_files $uri $uri/ =404;
		# A copy of every page request goes to the collector. The mirror is
		# fire-and-forget: nginx does not wait for it, and the visitor's
		# response is unaffected by whether it answered. The asset location
		# above is deliberately outside this, so only pages are counted.
		mirror /_ingest;
		mirror_request_body off;
	}

	# The collector's address is a variable so nginx resolves it per request
	# instead of refusing to start when the container is absent: the site must
	# serve with the monitor stopped, missing or crashed.
	location = /_ingest {
		internal;
		proxy_pass $admin/ingest;
		proxy_method POST;
		proxy_pass_request_body off;
		proxy_set_header Content-Length "";
		proxy_set_header X-Original-URI $request_uri;
		proxy_set_header X-Original-Method $request_method;
		proxy_set_header CF-Connecting-IP $http_cf_connecting_ip;
		proxy_set_header CF-IPCountry $http_cf_ipcountry;
		proxy_set_header Referer $http_referer;
		proxy_set_header User-Agent $http_user_agent;
		proxy_connect_timeout 1s;
		proxy_send_timeout 1s;
		proxy_read_timeout 1s;
	}

	# The heartbeat the landing page and the game shell send while they are
	# visible, which is the whole of how long a session lasts. POST only, half a
	# kilobyte at most, and quiet whatever happens: rate-limited, oversize,
	# refused or never answered, the visitor gets a 204. A stopped collector must
	# not print a 502 in anyone's console — which is also why the upstream is the
	# same lazily resolved variable the mirror uses.
	#
	# Cloudflare Access must never cover this route: anonymous visitors call it.
	location = /beat {
		limit_except POST { deny all; }
		limit_req zone=beat burst=5 nodelay;
		limit_req_status 429;
		client_max_body_size 512;
		client_body_buffer_size 1k;
		proxy_pass $admin/beat;
		proxy_set_header X-Original-URI $request_uri;
		proxy_set_header CF-Connecting-IP $http_cf_connecting_ip;
		proxy_set_header CF-IPCountry $http_cf_ipcountry;
		proxy_set_header Referer $http_referer;
		proxy_set_header User-Agent $http_user_agent;
		proxy_connect_timeout 1s;
		proxy_send_timeout 1s;
		proxy_read_timeout 1s;
		proxy_intercept_errors on;
		error_page 403 405 413 429 500 502 503 504 = /_beat_ok;
	}

	location = /_beat_ok {
		internal;
		access_log off;
		return 204;
	}

	# Cloudflare Access guards this path at the edge and hands the origin the
	# signed assertion; the collector validates it and answers 403 on its own
	# if it cannot. `^~`, because the caching regexes above would otherwise win
	# for /admin/static/admin.js and serve it from the site root instead.
	# The collector sets its own `no-store` and `noindex` on every response,
	# 403 included, so nothing is added here.
	location ^~ /admin {
		proxy_pass $admin;
		proxy_http_version 1.1;
		proxy_set_header Host $host;
		proxy_set_header Cf-Access-Jwt-Assertion $http_cf_access_jwt_assertion;
		proxy_set_header CF-Connecting-IP $http_cf_connecting_ip;
		proxy_set_header X-Forwarded-Proto $scheme;
	}
}

# The static server for the web build. No COOP/COEP headers: the preset exports
# without threads, which is what lets any host serve the page.
#
# Nothing here is immutable. The export does not hash filenames, so a browser
# that trusted a long max-age on index.wasm would run the old engine against the
# new index.pck after a redeploy. Every asset revalidates instead; ETag and
# Last-Modified stay on, so an unchanged file is a 304 rather than a re-download.
server {
	listen 80;
	server_name _;
	root /usr/share/nginx/html;
	index index.html;

	# The image's mime.types already names application/wasm, but a page that
	# silently loses streaming compilation is not a fault to leave to a base image.
	types {
		text/html html;
		application/javascript js;
		application/wasm wasm;
		application/octet-stream pck;
		application/json json;
		image/png png;
		image/svg+xml svg;
		image/x-icon ico;
	}

	gzip on;
	gzip_vary on;
	gzip_min_length 1024;
	gzip_types text/html application/javascript application/wasm application/octet-stream application/json;

	location = /healthz {
		access_log off;
		default_type text/plain;
		return 200 "ok\n";
	}

	# The entry points, which must never be stale: the page itself, and the
	# manifest and service worker a PWA export would add (off today; see the
	# preset). Naming them costs nothing while they are absent.
	location ~* (^/index\.html|/manifest\.json|\.service\.worker\.js)$ {
		add_header Cache-Control "no-cache";
	}

	location ~* \.(wasm|pck|js)$ {
		add_header Cache-Control "public, max-age=0, must-revalidate";
	}

	location / {
		try_files $uri $uri/ =404;
	}
}

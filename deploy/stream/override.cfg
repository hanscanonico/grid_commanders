; Project settings for the stream's copy of the game only: Godot reads this file
; from beside project.godot. The boot splash is the card for the match about to
; load, which deploy/stream/entrypoint.sh draws. No log files, because the
; container's capped log already has every line.
[application]

boot_splash/image="/run/stream/card.png"
boot_splash/use_filter=false
boot_splash/bg_color=Color(0.078, 0.09, 0.122, 1)

[debug]

file_logging/enable_file_logging.pc=false

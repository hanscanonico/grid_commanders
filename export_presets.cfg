; Export presets. The Android debug preset is the mobile plan's MB1.
;
; NO SIGNING SECRET LIVES HERE. A debug build is signed with the machine's
; ~/.android/debug.keystore, named in the editor settings and never in the
; repository; a release keystore and its passwords are machine setup too.
; .gitignore refuses *.keystore, *.jks, *.apk and *.aab so neither can be
; committed by accident. See README.md "Mobile builds (Android)".
;
; bin/* is the vendored engine (README's setup step). It is gitignored, but an
; export walks the project directory rather than the index, so without this the
; whole Godot.app rides along — and in a git worktree, where bin is a symlink
; back to the main checkout, it rides along once per recursion level.
;
; addons/godot_ai/ is deliberately NOT excluded. D7 wanted it out behind the
; feature-tagged override autoload/_mcp_game_helper.mobile="", and that
; mechanism is refuted on 4.7.1: Main::start reads each autoload/* property
; raw, so the base entry loads anyway, and the dotted key is picked up as an
; autoload of its own with an empty path — one "Failed to instantiate an
; autoload" per boot, on every platform including desktop. Excluding the
; directory while the entry still names it is the same error. Unregistering
; the helper belongs to the addon that registers it, so it is a follow-up
; rather than a packaging trick.

